name: Repository Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java tests
        shell: bash
        run: |
          set -e
          if [ -f pom.xml ]; then
            mvn --batch-mode test
          elif [ -x ./gradlew ]; then
            ./gradlew test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Gradle wrapper missing; cannot run Gradle tests." >&2
            exit 1
          else
            echo "No root Java build manifest found; skipping Java tests."
          fi

      - name: Python tests
        shell: bash
        run: |
          set -e
          if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
            uv sync --all-groups
            if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -print -quit | grep -q .; then
              uv run pytest -q
            else
              echo "No Python tests found."
            fi
          elif [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip uv
            uv sync --all-groups
            if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -print -quit | grep -q .; then
              uv run pytest -q
            else
              echo "No Python tests found."
            fi
          else
            if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
            if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -print -quit | grep -q .; then
              python -m pip install pytest
              pytest -q
            else
              echo "No Python tests found."
            fi
          fi

      - name: Node tests and build
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          else
            echo "No root package.json found; skipping Node.js checks."
          fi
