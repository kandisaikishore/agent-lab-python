name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Prepare deployment
        run: |
          set -euo pipefail
          mkdir -p ./_site/app/static
          if [[ -d docs ]]; then cp -r docs/. ./_site/; fi
          if [[ -d app/static ]]; then cp -r app/static/. ./_site/app/static/; fi

          uv run python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          from app.models import GameState
          from app.game_service import GameSession

          template_dir = Path("app/templates")
          if not (template_dir / "home.html").is_file():
              raise SystemExit("Required template app/templates/home.html is missing")

          env = Environment(loader=FileSystemLoader(str(template_dir)))
          template = env.get_template("home.html")
          html = template.render(
              session=GameSession(),
              GameState=GameState,
              url_for=lambda name, path="": (
                  f"/agent-lab-python/app/static/{path}" if name == "static" else path
              ),
          )
          Path("_site/app/index.html").write_text(html, encoding="utf-8")
          PY

          touch ./_site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
